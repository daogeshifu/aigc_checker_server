  function el(tag,attrs={},text) {
    const e=document.createElementNS(NS,tag);
    Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,String(v)));
    if(text!==undefined)e.textContent=text;
    return e;
  }
  const measureCanvas=document.createElement('canvas');
  const ctx=measureCanvas.getContext('2d');
  function wrap(text,maxWidth,size,weight=400) {
    ctx.font=weight+' '+size+'px '+(getComputedStyle(root).fontFamily||'sans-serif');
    const words=String(text).match(/[A-Za-z0-9_./{}<>:+-]+|\s+|[^\x00-\x7F]|./g)||[];
    const out=[];let line='';
    for(const token of words){
      if(ctx.measureText(line+token).width>maxWidth && line){out.push(line.trim());line='';}
      if(ctx.measureText(token).width>maxWidth){
        for(const ch of token){if(ctx.measureText(line+ch).width>maxWidth&&line){out.push(line.trim());line='';}line+=ch;}
      } else line+=token;
    }
    if(line.trim())out.push(line.trim());
    return out;
  }
  function draw(key,width){
    const svg=root.querySelector('#aigc-panel-'+key+' svg');
    svg.replaceChildren();
    const base=parseFloat(getComputedStyle(root).getPropertyValue('--font-size-base'))||14;
    const font=base,small=Math.max(11,base-2),line=font*1.5,subline=small*1.6;
    const narrow=width<590,margin=narrow?14:20,gap=narrow?0:48;
    const full=width-margin*2,col=(full-gap)/2;
    const registry=new Map(),links=[],sections=[],nodes=[];
    let y=14;
    flows[key].forEach((section,si)=>{
      if(si)y+=25;
      sections.push({title:section.section,y});y+=35;
      section.rows.forEach(row=>{
        if(row.edges)links.push(...row.edges);
        if(narrow){
          row.cells.forEach((n,ni)=>{
            const mainLines=wrap(n.title,full-34,font,500);
            const subLines=n.lines.flatMap(t=>wrap(t,full-34,small));
            const h=24+mainLines.length*line+subLines.length*subline+(subLines.length?5:0);
            const item={...n,x:margin,y,w:full,h,mainLines,subLines};
            registry.set(n.id,item);nodes.push(item);y+=h+(ni<row.cells.length-1?40:0);
          });y+=38;
        }else{
          const entries=row.cells.map((n,i)=>{
            const w=row.cells.length===1?Math.min(full,470):col;
            const x=row.cells.length===1?(width-w)/2:margin+i*(col+gap);
            const mainLines=wrap(n.title,w-34,font,500);
            const subLines=n.lines.flatMap(t=>wrap(t,w-34,small));
            const h=24+mainLines.length*line+subLines.length*subline+(subLines.length?5:0);
            return {...n,x,y,w,h,mainLines,subLines};
          });
          entries.forEach(n=>{registry.set(n.id,n);nodes.push(n);});
          y+=Math.max(...entries.map(n=>n.h))+40;
        }
      });
    });
    const height=y-20;svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.setAttribute('height',height);
    const defs=el('defs');
    const marker=el('marker',{id:'af-arrow-'+key,viewBox:'0 0 8 8',refX:7,refY:4,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});
    marker.append(el('path',{d:'M 1 1 L 7 4 L 1 7',fill:'none',stroke:'var(--muted-foreground)','stroke-width':1.2}));defs.append(marker);svg.append(defs);
    const edgeLayer=el('g',{'aria-hidden':'true'});svg.append(edgeLayer);
    const labelLayer=el('g',{'aria-hidden':'true'}),drawnLabels=new Set();
    links.forEach(([from,to,label='',style='',route=''])=>{
      const a=registry.get(from),b=registry.get(to);if(!a||!b)return;
      let d,lx,ly,anchor='middle';
      const sideBySide=!narrow&&Math.abs(a.y-b.y)<3;
      const backwards=b.y<a.y;
      const mobileSkip=narrow&&nodes.some(n=>n.id!==a.id&&n.id!==b.id&&n.y>a.y&&n.y<b.y);
      const rail=route==='rail'||backwards||mobileSkip;
      if(sideBySide){
        const left=a.x<b.x,start=left?a.x+a.w:a.x,end=left?b.x:b.x+b.w;
        const yy=Math.min(a.y+a.h/2,b.y+b.h/2);d=`M ${start} ${yy} H ${end}`;lx=(start+end)/2;ly=yy-8;
      }else if(rail){
        const right=a.x+a.w/2>=width/2;
        const railX=right?width-(narrow?3:6):(narrow?3:6);
        const ax=right?a.x+a.w:a.x,bx=b.x+b.w/2;
        const ay=a.y+a.h*.67,by=b.y-14;
        d=`M ${ax} ${ay} H ${railX} V ${by} H ${bx} V ${b.y}`;
        lx=right?railX-7:railX+7;ly=a.y+a.h+18;anchor=right?'end':'start';
      }else{
        const ax=a.x+a.w/2,bx=b.x+b.w/2,ay=a.y+a.h,by=b.y,mid=(ay+by)/2;
        d=`M ${ax} ${ay} V ${mid} H ${bx} V ${by}`;lx=Math.abs(ax-bx)<20?ax+8:(ax+bx)/2;ly=mid-6;anchor=Math.abs(ax-bx)<20?'start':'middle';
      }
      edgeLayer.append(el('path',{d,class:'af-link'+(style==='optional'?' af-optional':''),'marker-end':`url(#af-arrow-${key})`}));
      const labelKey=[label,Math.round(lx),Math.round(ly)].join(':');
      if(label&&!drawnLabels.has(labelKey)){
        drawnLabels.add(labelKey);
        const t=el('text',{x:lx,y:ly,class:'af-label','font-size':small,'text-anchor':anchor},label);
        labelLayer.append(t);
      }
    });
    sections.forEach(s=>{
      const lines=wrap(s.title,full,font,500);
      ctx.font='500 '+font+'px '+(getComputedStyle(root).fontFamily||'sans-serif');
      svg.append(el('rect',{x:margin-3,y:s.y-2,width:ctx.measureText(lines[0]).width+10,height:font+9,fill:'var(--background)'}));
      const t=el('text',{x:margin,y:s.y+font,class:'af-section','font-size':font},lines[0]);
      svg.append(t);
    });
    nodes.forEach(n=>{
      const g=el('g',{'data-node':n.id});
      if(n.tip)g.setAttribute('data-tooltip',n.tip);
      g.append(el('title',{},[n.title,...n.lines,n.tip].filter(Boolean).join('；')));
      const shape=el('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:n.kind==='gate'?3:10,class:'af-node'+(n.kind!=='normal'?' af-node-'+n.kind:'')});g.append(shape);
      if(n.kind==='gate')g.append(el('rect',{x:n.x+1,y:n.y+10,width:3,height:n.h-20,rx:1,class:'af-keymark'}));
      let ty=n.y+16+font*.8;
      n.mainLines.forEach(t=>{g.append(el('text',{x:n.x+n.w/2,y:ty,'text-anchor':'middle','font-size':font,class:'af-title'},t));ty+=line;});
      if(n.subLines.length)ty+=3;
      n.subLines.forEach(t=>{g.append(el('text',{x:n.x+n.w/2,y:ty,'text-anchor':'middle','font-size':small,class:'af-subtitle'},t));ty+=subline;});
      svg.append(g);
    });
    svg.append(labelLayer);
  }
  function redraw(){
    const width=Math.round(root.getBoundingClientRect().width);
    if(width>0)views.forEach(key=>draw(key,width));
  }
  function activate(key,save=false){
    key="detection";
    if(!views.includes(key))key='overview';
    views.forEach(v=>{
      const active=v===key;
      const button=root.querySelector('#aigc-tab-'+v);
      button.setAttribute('aria-selected',String(active));button.classList.toggle('active',active);
      root.querySelector('#aigc-panel-'+v).hidden=!active;
    });
    if(save&&window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{flow_view:key},privateContent:null}).catch(()=>{});
  }
  views.forEach(key=>root.querySelector('#aigc-tab-'+key).addEventListener('click',()=>activate(key,true)));
  const state=window.openai?.widgetState;
  activate(state?.modelContent?.flow_view||'overview');
  window.addEventListener('openai:set_globals',event=>{
    const s=event.detail?.globals?.widgetState;
    if(s)activate(s.modelContent?.flow_view||'overview');
  });
  new ResizeObserver(redraw).observe(root);
  if(document.fonts?.ready)document.fonts.ready.then(redraw);
  redraw();
})();
</script>
